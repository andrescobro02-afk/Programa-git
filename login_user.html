<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>parKing - Consulta Cliente</title>
    <!-- Fuentes modernas -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Iconos FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Archivo de estilos principal -->
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-body), #e2e8f0);
            font-family: 'Inter', sans-serif;
        }

        .login-container {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-logo {
            margin-bottom: 2rem;
        }

        .login-logo img {
            max-width: 150px;
        }

        .login-title {
            color: var(--primary-color);
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .login-form {
            text-align: left;
            animation: fadeIn 0.4s ease forwards;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: var(--text-dark);
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background: #1d4ed8;
        }

        .error-msg {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
            text-align: center;
        }

        .link-switch {
            display: block;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #64748b;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }
        
        .link-switch:hover {
            color: var(--primary-color);
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-logo">
            <img src="img/logo.png" alt="parKing Logo">
        </div>

        <div class="login-title">Consulta de Cliente</div>

        <!-- Formulario Cliente -->
        <div id="form-cliente" class="login-form">
            <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 1.5rem; text-align: center;">Ingrese la placa de su vehÃ­culo para ver el tiempo transcurrido y tarifa.</p>
            <div class="form-group">
                <label for="placa">Placa del VehÃ­culo</label>
                <input type="text" id="placa" class="form-control" placeholder="Ej: ABC-123" style="text-transform: uppercase;">
            </div>
            <button class="btn-login" onclick="loginCliente()"><i class="fas fa-search"></i> Consultar Estado</button>
            <p id="error-cliente" class="error-msg">VehÃ­culo no registrado en este momento.</p>
        </div>

        <a href="login_admin.html" class="link-switch">Soy un Administrador</a>
    </div>

    <!-- Script de autenticaciÃ³n -->
        <script>
        async function loginCliente() {
            const placaIngresada = document.getElementById('placa').value.trim().toUpperCase();
            const errorMsg = document.getElementById('error-cliente');
            
            errorMsg.style.display = 'none';

            if(!placaIngresada) {
                errorMsg.textContent = 'Por favor ingrese una placa válida.';
                errorMsg.style.display = 'block';
                return;
            }

            try {
                const res = await fetch('/api/parking/cliente', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ placa: placaIngresada })
                });
                
                if (!res.ok) {
                    errorMsg.textContent = 'Vehículo no registrado en este momento.';
                    errorMsg.style.display = 'block';
                    return;
                }
                
                const data = await res.json();
                if (data.success && data.vehiculo) {
                    localStorage.setItem('role', 'cliente');
                    localStorage.setItem('placaActual', placaIngresada);
                    window.location.href = 'user_dashboard.html'; 
                } else {
                    errorMsg.textContent = 'Vehículo no registrado en este momento.';
                    errorMsg.style.display = 'block';
                }
            } catch(e) {
                errorMsg.textContent = 'Error de conexión con el servidor.';
                errorMsg.style.display = 'block';
            }
        }

        // Permitir enter para loguearse
        document.getElementById('placa').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loginCliente();
            }
        });
    </script>
</body>
</html>
