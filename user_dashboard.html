<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>parKing - Mi Vehículo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .user-container {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        .user-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 30px;
            text-align: center;
        }

        .placa-badge {
            display: inline-block;
            background: #1e293b;
            color: #f1f5f9;
            font-size: 2rem;
            font-weight: 700;
            padding: 10px 25px;
            border-radius: 8px;
            letter-spacing: 2px;
            margin: 15px 0;
            border: 2px solid #cbd5e1;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 30px;
            text-align: left;
        }

        .info-item {
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .info-label {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 5px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .info-value {
            font-size: 1.25rem;
            color: #0f172a;
            font-weight: 700;
        }

        .info-value.highlight {
            color: var(--primary-color);
        }

        .logout-btn-user {
            display: inline-block;
            margin-top: 25px;
            color: #dc2626;
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.3s;
        }

        .logout-btn-user:hover {
            opacity: 0.8;
        }

        .tariff-info {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #94a3b8;
        }
    </style>
</head>
<body style="background: linear-gradient(135deg, var(--bg-body), #e2e8f0);">

    <div class="user-container">
        <div class="user-card">
            <img src="img/logo.png" alt="parKing Logo" style="max-width: 120px; margin-bottom: 10px;">
            <p style="color: #64748b; margin-bottom: 5px;">Estado de su vehículo</p>
            
            <div class="placa-badge" id="u-placa">---</div>
            
            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label"><i class="fas fa-parking"></i> Celda Asignada</div>
                    <div class="info-value" id="u-celda">-</div>
                </div>
                
                <div class="info-item">
                    <div class="info-label"><i class="far fa-clock"></i> Hora Ingreso</div>
                    <div class="info-value" style="font-size: 1.1rem;" id="u-ingreso">--:--</div>
                </div>

                <div class="info-item">
                    <div class="info-label"><i class="fas fa-hourglass-half"></i> Tiempo Transcurrido</div>
                    <div class="info-value" id="u-tiempo">0m</div>
                </div>

                <div class="info-item" style="background:#eff6ff; border-color:#bfdbfe;">
                    <div class="info-label" style="color:#1d4ed8;"><i class="fas fa-money-bill-wave"></i> Tarifa Estimada</div>
                    <div class="info-value highlight" id="u-tarifa">$ 0</div>
                </div>
            </div>

            <p class="tariff-info">* La tarifa se calcula a $100 COP por minuto exacto.</p>

            <a href="login.html" class="logout-btn-user" onclick="localStorage.removeItem('role'); localStorage.removeItem('placaActual');">
                <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
            </a>
        </div>
    </div>

    <!-- Script Cliente -->
    <script src="js/user_app.js"></script>

</body>
</html>
